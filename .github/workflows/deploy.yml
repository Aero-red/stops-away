# GitHub Pages deploy for Stops Away. This folder becomes the repository root when it is
# split out of LOTUS (see README "Publishing"), so the paths below are relative to it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Data builder tests (synthetic; real-data tests skip without the GTFS download)
        run: python3 tools/tests/run_tests.py
      - name: Install
        working-directory: app
        run: npm ci
      - name: Test and type-check
        working-directory: app
        run: npm test && npm run check
      - name: Build
        working-directory: app
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
